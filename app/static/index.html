<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document QA System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .auth-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .main-content {
            display: none;
        }

        .main-content.active {
            display: block;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"],
        textarea,
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .documents-list {
            margin-top: 20px;
        }

        .document-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .document-info {
            flex: 1;
        }

        .document-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .document-meta {
            font-size: 14px;
            color: #666;
        }

        .btn-delete {
            background: #dc3545;
            padding: 8px 16px;
            font-size: 14px;
        }

        .answer-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .answer-text {
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .sources {
            margin-top: 20px;
        }

        .source-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .source-title {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .source-content {
            color: #666;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin: 20px 0;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border: 1px solid #c3e6cb;
        }

        .user-info {
            color: white;
            text-align: right;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            padding: 8px 16px;
            font-size: 14px;
            margin-left: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab {
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .tab.active {
            background: white;
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Document QA System</h1>

        <div class="auth-section" id="authSection">
            <div class="card">
                <h2>🔐 Login</h2>
                <div id="authError"></div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="username" value="admin">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" value="admin123">
                </div>
                <button onclick="login()">Login</button>
            </div>
        </div>

        <div class="main-content" id="mainContent">
            <div class="user-info">
                Logged in as: <strong id="currentUser"></strong>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('query')">💬 Ask Questions</button>
                <button class="tab" onclick="switchTab('upload')">📤 Upload Documents</button>
                <button class="tab" onclick="switchTab('documents')">📄 Manage Documents</button>
            </div>

            <div id="queryTab" class="tab-content active">
                <div class="card">
                    <h2>💬 Ask a Question</h2>
                    <div id="queryError"></div>
                    <div class="form-group">
                        <label>Your Question</label>
                        <textarea id="question" placeholder="What would you like to know?"></textarea>
                    </div>
                    <button onclick="askQuestion()">Get Answer</button>
                    <div id="answerSection"></div>
                </div>
            </div>

            <div id="uploadTab" class="tab-content">
                <div class="card">
                    <h2>📤 Upload Documents</h2>
                    <div id="uploadError"></div>
                    <div id="uploadSuccess"></div>
                    <div class="form-group">
                        <label>Upload Files (PDF, TXT, DOCX, MD)</label>
                        <input type="file" id="fileUpload" multiple accept=".pdf,.txt,.docx,.md">
                    </div>
                    <button onclick="uploadFiles()">Upload & Index</button>
                </div>

                <div class="card">
                    <h2>✍️ Add Text Document</h2>
                    <div class="form-group">
                        <label>Document Title</label>
                        <input type="text" id="docTitle" placeholder="Enter document title">
                    </div>
                    <div class="form-group">
                        <label>Document Content</label>
                        <textarea id="docContent" placeholder="Paste your document content here"></textarea>
                    </div>
                    <button onclick="addDocument()">Add Document</button>
                </div>
            </div>

            <div id="documentsTab" class="tab-content">
                <div class="card">
                    <h2>📄 Indexed Documents</h2>
                    <button onclick="loadDocuments()">🔄 Refresh List</button>
                    <div id="documentsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
            
            if (tabName === 'documents') {
                loadDocuments();
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('authError');
            errorDiv.innerHTML = '';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/auth/token', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    token = data.access_token;
                    document.getElementById('currentUser').textContent = username;
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('mainContent').classList.add('active');
                    loadDocuments();
                } else {
                    errorDiv.innerHTML = '<div class="error">Invalid credentials</div>';
                }
            } catch (error) {
                errorDiv.innerHTML = '<div class="error">Login failed: ' + error.message + '</div>';
            }
        }

        function logout() {
            token = null;
            document.getElementById('authSection').style.display = 'block';
            document.getElementById('mainContent').classList.remove('active');
            document.getElementById('password').value = '';
        }

        async function uploadFiles() {
            const fileInput = document.getElementById('fileUpload');
            const files = fileInput.files;
            const errorDiv = document.getElementById('uploadError');
            const successDiv = document.getElementById('uploadSuccess');
            errorDiv.innerHTML = '';
            successDiv.innerHTML = '';

            if (files.length === 0) {
                errorDiv.innerHTML = '<div class="error">Please select files to upload</div>';
                return;
            }

            try {
                const formData = new FormData();
                for (let file of files) {
                    formData.append('files', file);
                }

                successDiv.innerHTML = '<div class="loading">Uploading and indexing documents...</div>';

                const response = await fetch('/documents/upload', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    successDiv.innerHTML = `<div class="success">Successfully uploaded and indexed ${data.length} document(s)!</div>`;
                    fileInput.value = '';
                } else {
                    const error = await response.json();
                    errorDiv.innerHTML = `<div class="error">${error.detail}</div>`;
                    successDiv.innerHTML = '';
                }
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">Upload failed: ${error.message}</div>`;
                successDiv.innerHTML = '';
            }
        }

        async function addDocument() {
            const title = document.getElementById('docTitle').value;
            const content = document.getElementById('docContent').value;
            const errorDiv = document.getElementById('uploadError');
            const successDiv = document.getElementById('uploadSuccess');
            errorDiv.innerHTML = '';
            successDiv.innerHTML = '';

            if (!title || !content) {
                errorDiv.innerHTML = '<div class="error">Please fill in both title and content</div>';
                return;
            }

            try {
                successDiv.innerHTML = '<div class="loading">Indexing document...</div>';

                const response = await fetch('/documents/', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        documents: [{
                            title: title,
                            content: content,
                            metadata: {}
                        }]
                    })
                });

                if (response.ok) {
                    successDiv.innerHTML = '<div class="success">Document indexed successfully!</div>';
                    document.getElementById('docTitle').value = '';
                    document.getElementById('docContent').value = '';
                } else {
                    const error = await response.json();
                    errorDiv.innerHTML = `<div class="error">${error.detail}</div>`;
                    successDiv.innerHTML = '';
                }
            } catch (error) {
                errorDiv.innerHTML = `<div class="error">Failed to add document: ${error.message}</div>`;
                successDiv.innerHTML = '';
            }
        }

        async function askQuestion() {
    const question = document.getElementById('question').value;
    const errorDiv = document.getElementById('queryError');
    const answerSection = document.getElementById('answerSection');

    // Clear previous error & answer
    errorDiv.innerHTML = '';
    answerSection.innerHTML = '';

    if (!question) {
        errorDiv.innerHTML = '<div class="error">Please enter a question</div>';
        return;
    }

    try {
        answerSection.innerHTML = '<div class="loading">Generating answer...</div>';

        const response = await fetch('/query/', {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                question: question,
                top_k: 5,
                return_sources: true
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Query failed');
        }

        const data = await response.json();

        // Build answer HTML
        const html = `
            <div class="answer-section">
                <h3>Answer:</h3>
                <div class="answer-text">${data.answer}</div>
                <small>Processing time: ${data.processing_time.toFixed(2)}s</small>
                ${data.sources && data.sources.length > 0 ? `
                <div class="sources">
                    <h4>📚 Sources:</h4>
                    ${data.sources.map((source, idx) => `
                        <div class="source-item">
                            <div class="source-title">${idx + 1}. ${source.title}</div>
                            <div class="source-content">${source.content}...</div>
                            <small>Relevance: ${(source.score * 100).toFixed(1)}%</small>
                        </div>
                    `).join('')}
                </div>` : ''}
            </div>
        `;

        // Replace old answer completely
        answerSection.innerHTML = html;

    } catch (err) {
        errorDiv.innerHTML = `<div class="error">${err.message}</div>`;
        answerSection.innerHTML = '';
    }
}


        async function loadDocuments() {
            const listDiv = document.getElementById('documentsList');
            listDiv.innerHTML = '<div class="loading">Loading documents...</div>';

            try {
                const response = await fetch('/documents/', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.documents.length === 0) {
                        listDiv.innerHTML = '<p style="text-align: center; color: #666; margin-top: 20px;">No documents indexed yet. Upload some documents to get started!</p>';
                        return;
                    }

                    let html = '<div class="documents-list">';
                    data.documents.forEach(doc => {
                        html += `<div class="document-item">`;
                        html += `<div class="document-info">`;
                        html += `<div class="document-title">${doc.title}</div>`;
                        html += `<div class="document-meta">`;
                        html += `ID: ${doc.id} | Chunks: ${doc.chunk_count} | `;
                        html += `Created: ${new Date(doc.created_at).toLocaleString()}`;
                        html += `</div></div>`;
                        html += `<button class="btn-delete" onclick="deleteDocument('${doc.id}')">Delete</button>`;
                        html += `</div>`;
                    });
                    html += '</div>';
                    
                    listDiv.innerHTML = html;
                } else {
                    listDiv.innerHTML = '<div class="error">Failed to load documents</div>';
                }
            } catch (error) {
                listDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        async function deleteDocument(docId) {
            if (!confirm('Are you sure you want to delete this document?')) {
                return;
            }

            try {
                const response = await fetch(`/documents/${docId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    loadDocuments();
                } else {
                    const error = await response.json();
                    alert('Delete failed: ' + error.detail);
                }
            } catch (error) {
                alert('Delete failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
